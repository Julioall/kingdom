<!doctype html><html lang="pt-BR"><meta charset="UTF-8"><base href="/"><title>Kingdom · Verificação dos sprites originais</title><style>body{margin:0;background:#182d29;color:#f3e8c4;font:18px Georgia;padding:28px}h1{font-size:26px;margin:0 0 8px}p{color:#b5c3ae;margin:0 0 20px}.grid{display:flex;gap:16px}.card{flex:1;background:#293e34;border:1px solid #6f7852;border-radius:12px;text-align:center;padding:16px}img{height:260px;width:100%;object-fit:contain;image-rendering:pixelated}h2{font-size:20px}canvas{width:100%;image-rendering:pixelated;background:#738b4d;border-radius:10px;margin-top:18px}small{color:#bdc6aa}</style><h1>Construções e arqueiros · sprites originais</h1><p>Quartel, arquearia e monastério agora usam recursos distintos do Tiny Swords.</p><div class="grid"><section class="card"><img src="/assets/tiny-swords/buildings/blue/barracks.png"><h2>Centro militar</h2><small>Infantaria e lanceiros</small></section><section class="card"><img src="/assets/tiny-swords/buildings/blue/archery.png"><h2>Arquearia</h2><small>Treinamento de arqueiros</small></section><section class="card"><img src="/assets/tiny-swords/buildings/blue/monastery.png"><h2>Monastério</h2><small>Treinamento de clérigos</small></section></div><canvas width="960" height="170"></canvas><script type="module">
import {createAnimationRenderer,getUnitAnimation} from '/src/ui/animations.js';
const ctx=document.querySelector('canvas').getContext('2d'), renderer=createAnimationRenderer();
await Promise.all(['idle','run','attack','arrow'].map(a=>renderer.load(getUnitAnimation('arqueiro',a,'blue'))));
function draw(now){ctx.clearRect(0,0,960,170);ctx.fillStyle='#f3ecc9';ctx.font='18px Georgia';for(const [i,action] of ['idle','run','attack'].entries()){const x=160+i*320;ctx.fillText(['Arqueiro · repouso','Arqueiro · caminhada','Arqueiro · disparo'][i],x-105,32);renderer.draw(ctx,getUnitAnimation('arqueiro',action,'blue'),x,145,{elapsedMs:now,scale:.85,loop:true});if(action==='attack'){const t=now%850/850;renderer.draw(ctx,getUnitAnimation('arqueiro','arrow','blue'),x+22+120*t,113,{elapsedMs:0,scale:.7});}}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
