name: "JUL-285 — Resource collision signature A/B"
on:
  push:
    branches:
      - perf/jul285-resource-index-signature
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: d095fc4d76d958e0fedaca25e869f78ed82d5d18
          path: baseline
      - uses: actions/checkout@v7.0.1
        with:
          path: candidate
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Same seeds and exact world-state digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          node baseline/scripts/benchmark-simulation.mjs --days=12 --warmup=3 --repeats=1 --seeds=1,42,2026 --output=out/baseline.json > out/baseline.txt
          node candidate/scripts/benchmark-simulation.mjs --days=12 --warmup=3 --repeats=1 --seeds=1,42,2026 --output=out/candidate.json > out/candidate.txt
          node --input-type=commonjs -e '
            const fs=require("node:fs");
            const a=JSON.parse(fs.readFileSync("out/baseline.json"));
            const b=JSON.parse(fs.readFileSync("out/candidate.json"));
            const comparison=[];
            for(const x of a.results){
              const y=b.results.find(r=>r.seed===x.seed&&r.repeat===x.repeat);
              if(!y||x.stateDigest!==y.stateDigest)throw Error("World digest changed for "+x.seed);
              comparison.push({seed:x.seed,digestEqual:true,baselineMs:x.meanDayMs,
                candidateMs:y.meanDayMs,improvementPercent:+(100*(x.meanDayMs-y.meanDayMs)/x.meanDayMs).toFixed(2)});
            }
            fs.writeFileSync("out/comparison.json",JSON.stringify(comparison,null,2));
            console.log(JSON.stringify(comparison,null,2));
          ' | tee out/comparison.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jul285-resource-index-ab
          path: out/
          if-no-files-found: warn
