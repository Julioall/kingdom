name: Kingdom CI

on:
  push:
    branches: [main, test/kingdom-autonomous, "codex/**"]
  pull_request:
    branches: [main, test/kingdom-autonomous]

permissions:
  contents: read

concurrency:
  group: kingdom-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run published test suite
        run: npm test

      - name: Build production assets
        run: npm run build
