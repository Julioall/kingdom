name: Kingdom verification CI

on:
  push:
    branches: [main, dev, "codex/**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kingdom-verification-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run published test suite
        run: npm test

      - name: Run deterministic food replay smoke on development branches
        if: github.ref == 'refs/heads/dev' || (github.event_name == 'pull_request' && github.base_ref == 'dev')
        run: npm run audit:food -- --days 30 --seeds 42 --repeat-seed 42

      - name: Build production assets
        run: npm run build

      - name: Compare commander-led tactics on the experimental PR
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/commander-led-tactics-20261111'
        run: node scripts/benchmark-squad-hierarchy.mjs --days=90 --seeds=1,42,2026 --scenario=midpoint --output=out/squad-benchmark.json

      - name: Generate interactive medieval battlefield replay
        if: (github.event_name == 'pull_request' && github.head_ref == 'feat/commander-led-tactics-20261111') || github.ref == 'refs/heads/codex/medieval-choreography-gate-20261112'
        run: |
          for seed in 1 42 2026; do
            node scripts/replay-medieval-battle.mjs --seed="$seed" --days=75 --interval=5 --output="out/battle-replay-$seed.html"
          done

      - name: Upload tactical replay and measurements for visual QA
        if: (github.event_name == 'pull_request' && github.head_ref == 'feat/commander-led-tactics-20261111') || github.ref == 'refs/heads/codex/medieval-choreography-gate-20261112'
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-medieval-battle-replay
          path: |
            out/battle-replay-*.html
            out/squad-benchmark.json
          retention-days: 14
