name: Kingdom CI

on:
  push:
    branches:
      - main
      - "test/**"
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run published test suite
        run: npm test

      - name: Run deterministic food replay smoke
        run: npm run audit:food -- --days 30 --seeds 42 --repeat-seed 42

      - name: Build production bundle
        run: npm run build
