name: "JUL-274 — Snapshot parity CPU A/B"
on:
  push:
    branches:
      - test/jul274-snapshot-digest-gate-20261102
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 3fa85e0b23c9fc8a81119cc74fbb33772d1c18ff
          path: baseline
      - uses: actions/checkout@v7.0.1
        with:
          path: candidate
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Two alternating complete-world A/B pairs
        env:
          BASELINE_SHA: 3fa85e0b23c9fc8a81119cc74fbb33772d1c18ff
        run: node candidate/scripts/benchmark-jul274-snapshot-ab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jul274-snapshot-cpu-ab
          path: out/jul274-snapshot-ab/
          if-no-files-found: warn
