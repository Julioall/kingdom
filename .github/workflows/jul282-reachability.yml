name: "JUL-282 — Deterministic reachable-area A/B"
on:
  push:
    branches:
      - perf/jul282-bounded-reachable-area

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout unchanged dev baseline
        uses: actions/checkout@v7.0.1
        with:
          ref: 46cc1a8d735e6634ebfac56feb5908d30eee7aba
          path: baseline

      - name: Checkout candidate optimization
        uses: actions/checkout@v7.0.1
        with:
          path: candidate

      - name: Use Node 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Replay same seeds on baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          node baseline/scripts/benchmark-simulation.mjs --days=24 --warmup=4 --repeats=1 --seeds=1,42,2026 --output=out/baseline.json > out/baseline.txt
          node candidate/scripts/benchmark-simulation.mjs --days=24 --warmup=4 --repeats=1 --seeds=1,42,2026 --output=out/candidate.json > out/candidate.txt
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const original = JSON.parse(fs.readFileSync("out/baseline.json", "utf8"));
            const candidate = JSON.parse(fs.readFileSync("out/candidate.json", "utf8"));
            const measures = [];
            for (const a of original.results) {
              const b = candidate.results.find(x => x.seed === a.seed && x.repeat === a.repeat);
              if (!b) throw Error("Missing candidate seed " + a.seed);
              if (a.stateDigest !== b.stateDigest) throw Error("Changed deterministic world state for seed " + a.seed);
              const changePct = 100 * (a.meanDayMs - b.meanDayMs) / a.meanDayMs;
              measures.push({ seed: a.seed, stateDigestMatch: true,
                baselineMeanDayMs: a.meanDayMs, candidateMeanDayMs: b.meanDayMs,
                candidateFasterPercent: +changePct.toFixed(2) });
            }
            const report = { schema: 1, commit: process.env.GITHUB_SHA,
              baseline: "dev@46cc1a8", hardware: "GitHub runner (not player hardware)",
              deterministic: true, measures };
            fs.writeFileSync("out/comparison.json", JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
          ' | tee out/comparison.txt

      - name: Collect candidate CPU profile
        shell: bash
        run: |
          set -euo pipefail
          node --cpu-prof --cpu-prof-dir=out --cpu-prof-name=jul282-candidate.cpuprofile candidate/scripts/benchmark-simulation.mjs --days=24 --warmup=4 --repeats=1 --seeds=42 --output=out/candidate-profile-run.json > out/candidate-profile-run.txt

      - name: Upload deterministic A/B and profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jul282-reachability-ab
          path: out/
          if-no-files-found: warn

      - name: Summarize
        if: always()
        shell: bash
        run: |
          echo "### JUL-282 — bounded reachable-area optimization" >> "$GITHUB_STEP_SUMMARY"
          if [ -f out/comparison.txt ]; then
            cat out/comparison.txt >> "$GITHUB_STEP_SUMMARY"
          fi
