name: "JUL-283 — Headless browser smoke (not GPU acceptance)"

on:
  push:
    branches:
      - qa/jul283-headless-browser-20261109
  pull_request:
    branches:
      - dev
    paths:
      - "src/ui/**"
      - "src/app/**"
      - "src/simulation/**"
      - "scripts/benchmark-jul269-browser.mjs"
      - ".github/workflows/jul283-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    name: Browser loading, render and Worker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium (software renderer)
        run: npx playwright install --with-deps chromium
      - name: Check headless render and Worker roundtrips
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p out
          node scripts/benchmark-jul269-browser.mjs --seed=42 --duration=6500 --output=out/jul283-headless-browser.json \
            | tee out/jul283-headless-browser.txt
      - name: Archive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jul283-headless-browser-smoke
          path: out/
          if-no-files-found: warn
