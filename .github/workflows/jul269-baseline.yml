name: "JUL-269 — Isolated simulation baseline"
on:
  push:
    branches:
      - bench/jul269-baseline-20261031

permissions:
  contents: read

jobs:
  baseline:
    name: "Simulation baseline — ${{ matrix.source.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        source:
          - name: dev
            ref: 46cc1a8d735e6634ebfac56feb5908d30eee7aba
          - name: main
            ref: ee856209dccebe9b3f92df8e395417672e5281d9

    steps:
      - name: Checkout isolated benchmark instrumentation
        uses: actions/checkout@v7.0.1
        with:
          path: bench

      - name: Checkout unchanged target source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ matrix.source.ref }}
          path: source

      - name: Install Node 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install locked dependencies for the source commit
        working-directory: source
        run: npm ci

      - name: Benchmark disposable worlds and snapshot transport
        shell: bash
        env:
          SOURCE_COMMIT: ${{ matrix.source.ref }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp bench/scripts/benchmark-jul269-baseline.mjs source/scripts/benchmark-jul269-baseline.mjs
          cd source
          node scripts/benchmark-jul269-baseline.mjs --seeds=1,42,2026 --days=30 --warmup=5 --repeats=2 --output=../out/${{ matrix.source.name }}.json | tee ../out/${{ matrix.source.name }}.txt

      - name: Capture CPU hot functions (main only)
        if: matrix.source.name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          cd source
          node --cpu-prof --cpu-prof-dir=../out --cpu-prof-name=jul269-main.cpuprofile scripts/benchmark-simulation.mjs --days=24 --warmup=4 --repeats=1 --seeds=42 --output=../out/main-cpu-simulation.json > ../out/main-cpu-output.txt
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const profile = JSON.parse(fs.readFileSync("../out/jul269-main.cpuprofile", "utf8"));
            const nodes = new Map(profile.nodes.map(n => [n.id, n.callFrame]));
            const samples = new Map();
            for (const id of profile.samples || []) {
              const f = nodes.get(id);
              if (!f) continue;
              const key = [f.functionName || "(anonymous)", f.url || "node internals"].join(" @ ");
              samples.set(key, (samples.get(key) || 0) + 1);
            }
            const sorted = [...samples.entries()].sort((a, b) => b[1] - a[1]);
            const total = (profile.samples || []).length;
            const result = {
              schema: 1, type: "V8 leaf CPU samples, not inclusive timing",
              source: "main@ee856209", seed: 42, days: 24,
              sampleCount: total, topFunctions: sorted.slice(0, 35).map(([name, count]) => ({
                name, count, sharePercent: +(100 * count / Math.max(total, 1)).toFixed(2)
              }))
            };
            fs.writeFileSync("../out/main-cpu-hotspots.json", JSON.stringify(result, null, 2));
            console.log(JSON.stringify(result.topFunctions.slice(0, 15), null, 2));
          ' | tee ../out/main-cpu-hotspots.txt

      - name: Record concise measurement summary
        if: always()
        shell: bash
        run: |
          echo "### JUL-269 — ${{ matrix.source.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: \`${{ matrix.source.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Measurements are on a GitHub-hosted Linux runner, not on the game player hardware.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f out/${{ matrix.source.name }}.txt ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat out/${{ matrix.source.name }}.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jul269-${{ matrix.source.name }}-baseline
          path: out/
          if-no-files-found: warn
