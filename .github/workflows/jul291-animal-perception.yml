name: "JUL-291 — Animal perception A/B"
on:
  pull_request:
    branches: [dev]
    paths:
      - "src/simulation/individuals/perception.js"
      - "tests/animal-canopy-observation-cache.test.mjs"
      - "scripts/benchmark-jul291-animal-los-cache.mjs"
      - ".github/workflows/jul291-animal-perception.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  animal-perception:
    name: Real world animal LOS A/B and full snapshot parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Measure real animal observations and validate causal parity
        env:
          JUL291_DAYS: 14
          JUL291_SEEDS: 1,42,2026
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p out
          node scripts/benchmark-jul291-animal-los-cache.mjs out/jul291-animal-los-cache.json \
            | tee out/jul291-animal-los-cache.log
      - name: Retain detailed paired samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jul291-animal-los-ab
          path: out/jul291-animal-los-cache.*
          if-no-files-found: warn
