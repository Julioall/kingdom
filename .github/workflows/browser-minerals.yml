name: Kingdom browser mineral visual proof

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/simulation/render-snapshot.js'
      - 'src/simulation/world/**'
      - 'src/ui/**'
      - 'scripts/verify-browser-minerals.mjs'
      - '.github/workflows/browser-minerals.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kingdom-mineral-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-minerals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install test-only Chromium automation
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture both renderers and CPU frame profiles
        run: node scripts/verify-browser-minerals.mjs
      - name: Preserve screenshots and performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-minerals-browser-evidence
          path: browser-mineral-evidence/
          retention-days: 7
          if-no-files-found: warn
