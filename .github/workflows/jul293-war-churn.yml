name: "JUL-293 — Territory war churn stress"
on:
  pull_request:
    branches: [dev]
    paths:
      - "scripts/support/jul293-war-stress.mjs"
      - "scripts/benchmark-jul293-war-churn.mjs"
      - "tests/territory-war-churn.test.mjs"
      - ".github/workflows/jul293-war-churn.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  war-churn:
    name: Exact war-siege, tower construction and annexation parity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Directed war-event and ownership tests
        run: node --test tests/territory-war-churn.test.mjs
      - name: Stress 3 worlds for 35 days with live tower damage and construction
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p out
          node scripts/benchmark-jul293-war-churn.mjs out/jul293-war-churn.json \
            | tee out/jul293-war-churn.log
      - name: Retain all event-level and daily timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jul293-war-churn
          path: out/jul293-war-churn.*
          if-no-files-found: warn
